<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세종형 교과탐구 질문독서 대화형 챗봇 by 김동진</title>
    <style>
        body { font-family: 'Apple SD Gothic Neo', sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background: #f8f9fa; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { color: #2c3e50; font-size: 1.4rem; border-bottom: 2px solid #34495e; padding-bottom: 10px; margin-top: 0; }
        button { background-color: #4A90E2; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .hidden { display: none; }
        .limit-notice { background: #ffeaa7; padding: 12px; border-radius: 8px; color: #d63031; font-weight: bold; margin-bottom: 15px; }
        
        /* 채팅 UI 스타일 */
        #chat-history { height: 450px; overflow-y: auto; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; background: #fafafa; margin-bottom: 15px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; white-space: pre-wrap; word-break: break-word; }
        .user-msg { background: #4A90E2; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-msg { background: #ffffff; color: #2c3e50; border: 1px solid #e2e8f0; align-self: flex-start; border-bottom-left-radius: 2px; }
        .chat-input-box { display: flex; gap: 10px; }
    </style>

    <!-- Firebase 호환 라이브러리 -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCXyoaT9gf1yfVCTtKggMr6iaBLZRDMDlw",
            authDomain: "dongjin-sejong-reading.firebaseapp.com",
            projectId: "dongjin-sejong-reading",
            storageBucket: "dongjin-sejong-reading.firebasestorage.app",
            messagingSenderId: "226177636155",
            appId: "1:226177636155:web:b5a78d5f7b2185e8a9891e"
        };

        const GEMINI_API_KEY = "AQ.Ab8RN6L-dcxotCcYPp11wO8laRdnxWew8rFMJ75LVGHfxmvnEQ";

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const provider = new firebase.auth.GoogleAuthProvider();

        let currentUser = null;
        let isAccessGranted = false;
        let chatConversationHistory = [];

        const SYSTEM_INSTRUCTION = `
넌 세종특별자치시교육청의 '질문-탐구-성찰' 중심 교과탐구 독서교육 전문가이자 친절한 수업 설계 컨설턴트야.
선생님과 대화를 나누며 학년, 교과 단원, 주제, 추천 도서를 함께 고민하고 최종적으로 [교과 탐구 독서 수업 프로그램 개발서]와 [학생용 활동지]를 완벽히 기획해주는 역할을 맡았어.

대화 규칙:
1. 항상 존중하고 전문적이면서 친절한 교사 컨설턴트 톤앤매너를 유지해.
2. 선생님이 특정 주제나 도서 추천을 물어보면 질문-탐구-성찰 구조에 적합한 아이디어를 대화하듯 제안해.
3. 선생님이 수업안 작성을 요청하면 기존 세종형 질문독서 3단계(질문 생성-깊이 읽기/탐구-3문장 메타인지 성찰)에 맞춘 수업 프로그램 개발서와 활동지를 구조화하여 작성해줘.
`;

        window.onload = function() {
            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    currentUser = user;
                    document.getElementById("user-email").innerText = user.email;
                    document.getElementById("login-section").classList.add("hidden");

                    if (!isAccessGranted) {
                        document.getElementById("password-section").classList.remove("hidden");
                        document.getElementById("app-section").classList.add("hidden");
                    }
                } else {
                    currentUser = null;
                    isAccessGranted = false;
                    document.getElementById("login-section").classList.remove("hidden");
                    document.getElementById("password-section").classList.add("hidden");
                    document.getElementById("app-section").classList.add("hidden");
                }
            });
        };

        function handleLogin() {
            auth.signInWithPopup(provider).catch((error) => alert("로그인 오류: " + error.message));
        }

        function handleLogout() {
            auth.signOut();
        }

        async function verifyPassword() {
            const inputPassword = document.getElementById("access-password").value;
            try {
                const docSnap = await db.collection("settings").doc("access_code").get();
                if (docSnap.exists && docSnap.data().password === inputPassword) {
                    isAccessGranted = true;
                    document.getElementById("password-section").classList.add("hidden");
                    document.getElementById("app-section").classList.remove("hidden");
                    await checkDailyLimit(currentUser.uid);
                    initChat();
                } else {
                    alert("접근 승인 비밀번호가 올바르지 않습니다.");
                }
            } catch (err) {
                alert("인증 오류: " + err.message);
            }
        }

        async function checkDailyLimit(uid) {
            const today = new Date().toISOString().split('T')[0];
            const userRef = db.collection("usage_limits").doc(`${uid}_${today}`);
            const docSnap = await userRef.get();

            const sendBtn = document.getElementById("send-btn");
            const limitNotice = document.getElementById("limit-notice");

            if (docSnap.exists && docSnap.data().count >= 5) {
                sendBtn.disabled = true;
                limitNotice.classList.remove("hidden");
            } else {
                sendBtn.disabled = false;
                limitNotice.classList.add("hidden");
            }
        }

        async function incrementUsage(uid) {
            const today = new Date().toISOString().split('T')[0];
            const userRef = db.collection("usage_limits").doc(`${uid}_${today}`);
            const docSnap = await userRef.get();

            if (docSnap.exists) {
                await userRef.update({ count: docSnap.data().count + 1 });
            } else {
                await userRef.set({ count: 1, email: currentUser.email, date: today });
            }
            await checkDailyLimit(uid);
        }

        function initChat() {
            if (chatConversationHistory.length === 0) {
                const welcomeMsg = "안녕하세요, 선생님! 📚 세종형 교과탐구 질문독서 지원 AI 컨설턴트입니다.\n\n어떤 학년/교과 단원이나 주제로 질문독서 수업을 구상하고 계신가요? 편하게 물어봐 주시면 적합한 도서나 수업 방향을 함께 논의해 드릴게요!";
                appendMessage("ai", welcomeMsg);
                chatConversationHistory.push({ role: "user", parts: [{ text: "안녕, 넌 누구니?" }] });
                chatConversationHistory.push({ role: "model", parts: [{ text: welcomeMsg }] });
            }
        }

        function appendMessage(sender, text) {
            const chatHistory = document.getElementById("chat-history");
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message", sender === "user" ? "user-msg" : "ai-msg");
            msgDiv.innerText = text;
            chatHistory.appendChild(msgDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function sendMessage() {
            const userInput = document.getElementById("user-input");
            const text = userInput.value.trim();
            if (!text) return;

            const sendBtn = document.getElementById("send-btn");
            userInput.value = "";
            appendMessage("user", text);

            sendBtn.disabled = true;
            sendBtn.innerText = "답변 작성 중...";

            chatConversationHistory.push({ role: "user", parts: [{ text: text }] });

            try {
                // x-goog-api-key 헤더 방식 적용
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-goog-api-key': GEMINI_API_KEY
                    },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
                        contents: chatConversationHistory
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message || "API 오류");
                }

                const aiReply = data.candidates[0].content.parts[0].text;

                chatConversationHistory.push({ role: "model", parts: [{ text: aiReply }] });
                appendMessage("ai", aiReply);

                await incrementUsage(currentUser.uid);
            } catch (error) {
                alert("대화 답변 생성 중 오류가 발생했습니다: " + error.message);
                console.error(error);
            } finally {
                sendBtn.innerText = "전송";
                await checkDailyLimit(currentUser.uid);
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</head>
<body>

    <div id="login-section" class="card">
        <h1>📚 세종형 교과탐구 질문독서 AI 컨설턴트 by 김동진</h1>
        <p>선생님과 대화하며 수업을 함께 기획하는 대화형 AI 시스템입니다.</p>
        <button onclick="handleLogin()">구글 계정으로 로그인하기</button>
    </div>

    <div id="password-section" class="card hidden">
        <h2>🔒 시스템 접근 승인</h2>
        <p>승인된 교사만 접근할 수 있도록 비밀번호를 요구합니다.</p>
        <label>접근 승인 비밀번호</label>
        <input type="password" id="access-password" placeholder="비밀번호를 입력하세요" style="margin-bottom: 10px;">
        <button onclick="verifyPassword()">접근 승인 확인</button>
    </div>

    <div id="app-section" class="card hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <span>👤 접속 교사: <strong id="user-email"></strong></span>
            <button onclick="handleLogout()" style="padding:6px 12px; background:#e74c3c;">로그아웃</button>
        </div>

        <div id="limit-notice" class="limit-notice hidden">
            ⚠️ 오늘의 일일 대화/수업안 생성 횟수(최대 5회)를 모두 소진하셨습니다.
        </div>

        <div id="chat-history"></div>

        <div class="chat-input-box">
            <input type="text" id="user-input" placeholder="예: 초등 4학년 분수 단원에 어울리는 독서 주제와 책을 추천해줘" onkeypress="handleKeyPress(event)">
            <button id="send-btn" onclick="sendMessage()" style="width: 100px;">전송</button>
        </div>
    </div>

</body>
</html>
