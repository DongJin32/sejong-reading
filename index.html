<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세종형 교과탐구 질문독서 지원 시스템 by 김동진</title>
    <style>
        body { font-family: 'Apple SD Gothic Neo', sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background: #f8f9fa; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { color: #2c3e50; font-size: 1.5rem; border-bottom: 2px solid #34495e; padding-bottom: 10px; }
        button { background-color: #4A90E2; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .result-box { background: #ffffff; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; white-space: pre-wrap; font-size: 0.95rem; line-height: 1.6; }
        .hidden { display: none; }
        .limit-notice { background: #ffeaa7; padding: 15px; border-radius: 8px; color: #d63031; font-weight: bold; }
        .auth-box { background: #eef2f5; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    </style>

    <!-- Firebase 호환 라이브러리 (로컬 file:// 실행 지원) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        // 1. Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCXyoat9gf1yfvCTTkggMr6iaBLZRDMDLw",
            authDomain: "dongjin-sejong-reading.firebaseapp.com",
            projectId: "dongjin-sejong-reading",
            storageBucket: "dongjin-sejong-reading.firebasestorage.app",
            messagingSenderId: "226177636155",
            appId: "1:226177636155:web:b5a78d5f7b2185e8a9891e"
        };

        // 2. Gemini API Key
        const GEMINI_API_KEY = "AQ.Ab8RN6L-dcxotCcYPp11wO8laRdnxWew8rFMJ75LVGHfxmvnEQ";

        // Firebase 초기화
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const provider = new firebase.auth.GoogleAuthProvider();

        let currentUser = null;
        let isAccessGranted = false;

        // 페이지 로드 시 상태 감지
        window.onload = function() {
            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    currentUser = user;
                    document.getElementById("user-email").innerText = user.email;
                    document.getElementById("login-section").classList.add("hidden");

                    if (!isAccessGranted) {
                        document.getElementById("password-section").classList.remove("hidden");
                        document.getElementById("app-section").classList.add("hidden");
                    }
                } else {
                    currentUser = null;
                    isAccessGranted = false;
                    document.getElementById("login-section").classList.remove("hidden");
                    document.getElementById("password-section").classList.add("hidden");
                    document.getElementById("app-section").classList.add("hidden");
                }
            });
        };

        // 로그인
        function handleLogin() {
            auth.signInWithPopup(provider).catch((error) => {
                alert("로그인 중 오류가 발생했습니다: " + error.message);
            });
        }

        // 로그아웃
        function handleLogout() {
            auth.signOut();
        }

        // 비밀번호 검증
        async function verifyPassword() {
            const inputPassword = document.getElementById("access-password").value;
            try {
                const docSnap = await db.collection("settings").doc("access_code").get();

                if (docSnap.exists && docSnap.data().password === inputPassword) {
                    isAccessGranted = true;
                    document.getElementById("password-section").classList.add("hidden");
                    document.getElementById("app-section").classList.remove("hidden");
                    await checkDailyLimit(currentUser.uid);
                } else {
                    alert("접근 승인 비밀번호가 올바르지 않습니다.");
                }
            } catch (err) {
                alert("인증 확인 중 오류 발생: " + err.message);
            }
        }

        // 일일 제한 체크 (하루 5회)
        async function checkDailyLimit(uid) {
            const today = new Date().toISOString().split('T')[0];
            const userRef = db.collection("usage_limits").doc(`${uid}_${today}`);
            const docSnap = await userRef.get();

            const generateBtn = document.getElementById("generate-btn");
            const limitNotice = document.getElementById("limit-notice");

            if (docSnap.exists && docSnap.data().count >= 5) {
                generateBtn.disabled = true;
                limitNotice.classList.remove("hidden");
            } else {
                generateBtn.disabled = false;
                limitNotice.classList.add("hidden");
            }
        }

        // 사용량 1 증가
        async function incrementUsage(uid) {
            const today = new Date().toISOString().split('T')[0];
            const userRef = db.collection("usage_limits").doc(`${uid}_${today}`);
            const docSnap = await userRef.get();

            if (docSnap.exists) {
                await userRef.update({ count: docSnap.data().count + 1 });
            } else {
                await userRef.set({ count: 1, email: currentUser.email, date: today });
            }
            await checkDailyLimit(uid);
        }

        // 수업안 및 활동지 생성
        async function generateLessonPlan() {
            const grade = document.getElementById("grade").value;
            const topic = document.getElementById("topic").value;
            const bookTitle = document.getElementById("book-title").value;
            const generateBtn = document.getElementById("generate-btn");

            if (!topic || !bookTitle) {
                alert("탐구 주제와 선정 도서를 입력해 주세요.");
                return;
            }

            generateBtn.disabled = true;
            generateBtn.innerText = "수업안 및 활동지 생성 중...";

            const hiddenSystemPrompt = `
넌 세종특별자치시교육청의 '질문-탐구-성찰' 중심 교과탐구 독서교육 전문가야.
선생님이 제공한 입력 정보를 바탕으로 [교과 탐구 독서 수업 프로그램 개발서]와 [학생용 활동지]를 작성해줘.

- 학년/학기: ${grade}
- 탐구 주제: ${topic}
- 선정 도서: ${bookTitle}

[출력 구조]
PART 1. 교과 탐구 독서 수업 프로그램 개발서
1. 수업 개요
2. 2022 개정 교육과정 성취기준 분석 및 단원 연계
3. 차시별 수업 흐름 (질문-탐구-성찰 구조)
4. 질문-탐구-성찰 단계별 교수·학습 과정 (상세)
5. 학생 평가 및 피드백 계획

PART 2. 학생용 교과탐구 독서 활동지
1. 생각 열기 (질문 생성)
2. 깊이 읽기 및 탐구활동
3. 3문장 메타인지 성찰 일지
`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: hiddenSystemPrompt }] }] })
                });

                const data = await response.json();
                const textResult = data.candidates[0].content.parts[0].text;

                document.getElementById("result-output").innerText = textResult;
                document.getElementById("result-section").classList.remove("hidden");

                await incrementUsage(currentUser.uid);
            } catch (error) {
                alert("수업안 생성 중 오류가 발생했습니다. API 키를 다시 확인해 주세요.");
                console.error(error);
            } finally {
                generateBtn.innerText = "수업안 및 활동지 생성하기";
            }
        }
    </script>
</head>
<body>

    <!-- 1. 구글 로그인 화면 -->
    <div id="login-section" class="card">
        <h1>📚 세종형 교과탐구 질문독서 지원 시스템</h1>
        <p>선생님 전용 수업안 자동 기획 및 활동지 생성 도구입니다.</p>
        <button onclick="handleLogin()">구글 계정으로 로그인하기</button>
    </div>

    <!-- 2. 비밀번호 입력 화면 -->
    <div id="password-section" class="card hidden">
        <h2>🔒 시스템 접근 승인</h2>
        <p>승인된 교사만 접근할 수 있도록 비밀번호를 요구합니다.</p>
        <div class="auth-box">
            <label>접근 승인 비밀번호</label>
            <input type="password" id="access-password" placeholder="비밀번호를 입력하세요">
            <button onclick="verifyPassword()">접근 승인 확인</button>
        </div>
    </div>

    <!-- 3. 메인 앱 화면 -->
    <div id="app-section" class="card hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <span>👤 접속 교사: <strong id="user-email"></strong></span>
            <button onclick="handleLogout()" style="width:auto; padding:5px 10px; background:#e74c3c;">로그아웃</button>
        </div>

        <div id="limit-notice" class="limit-notice hidden">
            ⚠️ 오늘의 일일 수업안 생성 횟수(최대 5회)를 모두 소진하셨습니다.
        </div>

        <h3>수업 기본 정보 입력</h3>
        <label>학년/학기</label>
        <select id="grade">
            <option>초등학교 3학년 2학기</option>
            <option>초등학교 4학년 1학기</option>
            <option>초등학교 5학년 1학기</option>
            <option>초등학교 6학년 1학기</option>
        </select>

        <label>수업 탐구 주제</label>
        <input type="text" id="topic" placeholder="예: 양의 등분할을 통한 분수의 필요성 이해">

        <label>선정 도서 및 출판사</label>
        <input type="text" id="book-title" placeholder="예: 견우와 직녀가 분수 때문에 싸웠대 (뭉치)">

        <button id="generate-btn" onclick="generateLessonPlan()">수업안 및 활동지 생성하기</button>
    </div>

    <!-- 4. 결과 출력 화면 -->
    <div id="result-section" class="card hidden">
        <h2>✨ 자동 생성된 수업안 및 활동지</h2>
        <div id="result-output" class="result-box"></div>
    </div>

</body>
</html>
